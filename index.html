
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Para mi Yuli 💖</title>
<meta name="description" content="Una galaxia especial para Yuli, mi profesorita hermosa.">

<style>
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:#000;
  font-family:Arial,sans-serif;
}
#galaxy-canvas{
  position:fixed;inset:0;
  width:100%;height:100%;
  touch-action:none;display:block;
}
.pill{
  position:fixed;top:18px;left:50%;
  transform:translateX(-50%);
  color:white;font-size:14px;
  text-align:center;
  padding:12px 22px;
  border-radius:30px;
  border:1px solid #ffffff40;
  background:#220d3280;
  backdrop-filter:blur(12px);
  z-index:5;
  width:max-content;
  max-width:90%;
  box-shadow:0 0 25px #ff80c030;
}
.firma{
  position:fixed;bottom:75px;
  width:100%;text-align:center;
  font-size:13px;color:#ffc3e5;
  text-shadow:0 0 12px #ff5bb9;
  pointer-events:none;
}
#tapMessage{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  color:white;text-align:center;
  background:#16051ce0;
  padding:30px 25px;
  border-radius:22px;
  border:1px solid #faafe57e;
  z-index:20;
  width:85%;max-width:360px;
  box-shadow:0 0 45px #ff78bf50;
}
#tapMessage h2{
  color:#ffc2e9;
  margin:0 0 12px;
  font-size:25px;
}
#tapMessage p{
  line-height:1.6;
  font-size:15px;
}
#tapMessage button{
  background:linear-gradient(120deg,#ff65ab,#b278ff);
  border:0;border-radius:25px;
  color:white;font-weight:bold;
  padding:13px 26px;
  cursor:pointer;
  margin-top:8px;
}
.player{
  position:fixed;
  left:10px;right:10px;bottom:10px;
  display:flex;justify-content:center;
  align-items:center;gap:12px;
  background:#160b2980;
  border:1px solid #ffffff25;
  backdrop-filter:blur(9px);
  border-radius:14px;padding:9px;
  color:white;
  z-index:10;
}
.player button{
  border:1px solid #ffffff35;
  color:white;background:#ffffff12;
  padding:9px 13px;
  border-radius:10px;
  cursor:pointer;
}
.player input{display:none}
.error{
  position:fixed;top:80px;left:10px;right:10px;
  color:#ffe4f0;background:#34091f;
  padding:12px;border-radius:10px;
  z-index:30;display:none;
}
#fx{
  position:fixed;inset:0;
  pointer-events:none;
  z-index:4;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body>

<canvas id="galaxy-canvas"></canvas>

<div class="pill">
  Yuli, eres una persona muy especial 💖
</div>

<div class="firma">
  Para mi Yuli, mi profesorita hermosa ✨
</div>

<div id="tapMessage">
  <h2>Para ti, Yuli 💖</h2>
  <p>
    Quiero que nunca olvides lo especial que eres.
    Confía en ti, sigue tus sueños y nunca te rindas.
    Tú puedes lograr todo, mi profesorita bonita.
  </p>
  <button id="entrarBtn">Descubre tu galaxia ✨</button>
</div>

<div class="player">
  <button id="playBtn">▶</button>
  <span style="font-size:12px">Nuestra música 🎵</span>
  <input type="file" id="pickFile" accept="audio/*">
  <button id="pickBtn">Elegir canción</button>
  <audio id="audio" preload="none">
    <source src="como_no_amarla.mp3" type="audio/mpeg">
  </audio>
</div>

<div id="err" class="error"></div>
<canvas id="fx"></canvas>

<script>
(function(){

// ==========================================
// FRASES PERSONALIZADAS PARA YULI
// ==========================================

const phrases = [
  "Yuli 💖",
  "Eres una persona muy especial ✨",
  "Tú puedes lograr todo 🌟",
  "Te esperaré mil años ♾️",
  "Mi profesorita hermosa 📚",
  "Creo mucho en ti 💗",
  "Nunca dejes de soñar 🌠",
  "Eres más fuerte de lo que imaginas 💪",
  "Estoy orgulloso de ti 💕",
  "Tu sonrisa ilumina mi universo 🌌",
  "Mereces cosas muy bonitas 🌷",
  "Confía siempre en ti 💫",
  "Que nadie apague tu luz ✨",
  "Eres única, Yuli 💖",
  "Siempre voy a desearte lo mejor 🌹",
  "Cada sueño tuyo vale la pena 🌟",
  "Mi profesora favorita 📖",
  "Eres capaz de cosas increíbles 💜",
  "Tu esfuerzo dará frutos 🌸",
  "Nunca te rindas, mi Yuli 🦋",
  "Mil años no serían suficientes ♾️",
  "Tienes un corazón muy bonito 💕",
  "Que la vida te regale alegrías 🌼",
  "Admiro tu forma de ser 💗",
  "Sigue brillando, profesorita ✨",
  "Hay un universo de sueños para ti 🌌",
  "Te quiero, mi Yuli ❤️",
  "Cada día puedes llegar más lejos 🌈",
  "Eres mi pensamiento bonito 💞",
  "Siempre especial para mí 💖"
];

// ==========================================
// REPRODUCTOR DE MÚSICA
// ==========================================

const audio=document.getElementById("audio");
const playBtn=document.getElementById("playBtn");
const pickBtn=document.getElementById("pickBtn");
const pickFile=document.getElementById("pickFile");
const mensaje=document.getElementById("tapMessage");

document.getElementById("entrarBtn").onclick=()=>{
  mensaje.style.display="none";
  audio.play().then(()=>{
    playBtn.textContent="⏸";
  }).catch(()=>{});
};

playBtn.onclick=()=>{
  if(audio.paused){
    audio.play().then(()=>{
      playBtn.textContent="⏸";
    }).catch(()=>{});
  }else{
    audio.pause();
    playBtn.textContent="▶";
  }
};

pickBtn.onclick=()=>pickFile.click();

pickFile.onchange=()=>{
  if(pickFile.files.length){
    audio.src=URL.createObjectURL(pickFile.files[0]);
    audio.play().then(()=>{
      playBtn.textContent="⏸";
    }).catch(()=>{});
  }
};

audio.onended=()=>playBtn.textContent="▶";

// ==========================================
// ESCENA 3D
// ==========================================

try{

if(typeof THREE==="undefined"){
  throw new Error("No se pudo cargar Three.js");
}

const canvas=document.getElementById("galaxy-canvas");

const renderer=new THREE.WebGLRenderer({
  canvas:canvas,
  antialias:true,
  alpha:false
});

renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
  75,innerWidth/innerHeight,0.1,2000
);

const controls=new THREE.OrbitControls(
  camera,renderer.domElement
);

controls.enableDamping=true;
controls.dampingFactor=0.06;
controls.minDistance=10;
controls.maxDistance=220;

function setCam(){
  let mobile=innerWidth<768||innerWidth<innerHeight;
  camera.fov=mobile?90:75;
  camera.position.set(0,mobile?26:22,mobile?110:75);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  controls.update();
}

setCam();

// ==========================================
// FONDO ESTELAR
// ==========================================

function makeStarTexture(size=1024,count=2600){

  const c=document.createElement("canvas");
  c.width=c.height=size;

  const g=c.getContext("2d");
  const r=size/2;

  const bg=g.createRadialGradient(
    r,r,r*0.2,r,r,r
  );

  bg.addColorStop(0,"#050010");
  bg.addColorStop(1,"#000000");

  g.fillStyle=bg;
  g.fillRect(0,0,size,size);

  for(let i=0;i<count;i++){

    const x=Math.random()*size;
    const y=Math.random()*size;
    const brightness=Math.random()*0.7+0.3;

    const glow=g.createRadialGradient(
      x,y,0,x,y,Math.random()*2.2+1.6
    );

    glow.addColorStop(
      0,"rgba(255,255,255,"+(0.65*brightness)+")"
    );

    glow.addColorStop(
      1,"rgba(200,150,255,"+(0.12*brightness)+")"
    );

    g.fillStyle=glow;
    g.beginPath();
    g.arc(x,y,Math.random()*1.2+0.6,0,Math.PI*2);
    g.fill();
  }

  return new THREE.CanvasTexture(c);
}

const starTex=makeStarTexture();

starTex.wrapS=THREE.RepeatWrapping;
starTex.wrapT=THREE.RepeatWrapping;

const bgSphere=new THREE.Mesh(
  new THREE.SphereGeometry(600,64,64),
  new THREE.MeshBasicMaterial({
    map:starTex,
    side:THREE.BackSide
  })
);

scene.add(bgSphere);

// ==========================================
// GALAXIA DE FRASES
// ==========================================

const galaxy=new THREE.Group();
scene.add(galaxy);

const phraseCount=Math.max(phrases.length*6,180);
const arms=5;
const radius=82;
const maxH=22;

// Textura de cada frase

function makeTextTexture(text,size=48){

  const c=document.createElement("canvas");
  c.width=1024;
  c.height=128;

  const g=c.getContext("2d");

  g.clearRect(0,0,c.width,c.height);

  g.font="800 "+size+"px Arial";
  g.textAlign="center";
  g.textBaseline="middle";

  g.shadowColor="rgba(210,140,255,0.95)";
  g.shadowBlur=24;

  g.fillStyle="rgba(255,240,255,0.98)";

  // Ajustar textos largos para evitar cortes
  let fontSize=size;
  while(g.measureText(text).width>990 && fontSize>20){
    fontSize-=2;
    g.font="800 "+fontSize+"px Arial";
  }

  g.fillText(text,c.width/2,c.height/2);

  return new THREE.CanvasTexture(c);
}

// Distribuir textos por la galaxia

for(let i=0;i<phraseCount;i++){

  const text=phrases[i%phrases.length];
  const tex=makeTextTexture(text);

  const spr=new THREE.Sprite(
    new THREE.SpriteMaterial({
      map:tex,
      transparent:true,
      depthWrite:false
    })
  );

  const perArm=phraseCount/arms;

  const ang=(i%perArm)*(Math.PI*2/perArm);

  const armAng=Math.floor(i/perArm)*
    (Math.PI*2/arms);

  const dist=Math.pow(
    i/phraseCount,0.72
  )*radius;

  const thickness=Math.pow(
    1-dist/radius,2
  );

  const x=Math.cos(ang+armAng)*dist;
  const z=Math.sin(ang+armAng)*dist;

  const y=(Math.random()-0.5)*
    maxH*thickness*0.9;

  spr.position.set(x,y,z);
  spr.scale.set(20,2.6,1);

  galaxy.add(spr);
}

// ==========================================
// PARTÍCULAS ESTELARES
// ==========================================

const starCount=8000;
const geom=new THREE.BufferGeometry();
const pos=new Float32Array(starCount*3);

for(let i=0;i<starCount;i++){

  const ang=Math.random()*Math.PI*2;
  const dist=Math.random()*radius*1.15;

  const y=(Math.random()-0.5)*36*
    Math.pow(
      1-Math.min(dist,radius)/radius,
      1.5
    );

  pos[i*3]=Math.cos(ang)*dist;
  pos[i*3+1]=y;
  pos[i*3+2]=Math.sin(ang)*dist;
}

geom.setAttribute(
  "position",
  new THREE.BufferAttribute(pos,3)
);

const stars=new THREE.Points(
  geom,
  new THREE.PointsMaterial({
    color:0xffffff,
    size:0.28,
    transparent:true,
    opacity:0.65,
    blending:THREE.AdditiveBlending
  })
);

galaxy.add(stars);

// ==========================================
// NÚCLEO DE LA GALAXIA
// ==========================================

const coreR=12;

const coreCanvas=document.createElement("canvas");
coreCanvas.width=256;
coreCanvas.height=256;

const cg=coreCanvas.getContext("2d");

const gradient=cg.createRadialGradient(
  128,128,10,128,128,128
);

gradient.addColorStop(0,"#140018");
gradient.addColorStop(0.6,"#090012");
gradient.addColorStop(1,"#000000");

cg.fillStyle=gradient;
cg.beginPath();
cg.arc(128,128,128,0,Math.PI*2);
cg.fill();

const core=new THREE.Mesh(
  new THREE.SphereGeometry(coreR,64,64),
  new THREE.MeshBasicMaterial({
    map:new THREE.CanvasTexture(coreCanvas)
  })
);

core.renderOrder=1;
scene.add(core);

// ==========================================
// ANILLO LUMINOSO
// ==========================================

const photonRing=new THREE.Mesh(
  new THREE.RingGeometry(
    coreR*1.05,
    coreR*1.18,
    128
  ),
  new THREE.MeshBasicMaterial({
    color:0xEAAEFF,
    transparent:true,
    opacity:0.95,
    side:THREE.DoubleSide
  })
);

photonRing.rotation.x=-Math.PI/2;
scene.add(photonRing);

// ==========================================
// HALO ROSADO Y VIOLETA
// ==========================================

function makeHaloTexture(){

  const c=document.createElement("canvas");
  c.width=c.height=1024;

  const g=c.getContext("2d");
  const r=512;

  const grd=g.createRadialGradient(
    r,r,r*0.45,r,r,r
  );

  grd.addColorStop(0,"rgba(255,200,240,0.45)");
  grd.addColorStop(0.35,"rgba(220,180,255,0.35)");
  grd.addColorStop(0.7,"rgba(160,200,255,0.28)");
  grd.addColorStop(1,"rgba(0,0,0,0)");

  g.fillStyle=grd;
  g.fillRect(0,0,1024,1024);

  return new THREE.CanvasTexture(c);
}

const haloPlane=new THREE.Mesh(
  new THREE.PlaneGeometry(320,320),
  new THREE.MeshBasicMaterial({
    map:makeHaloTexture(),
    transparent:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
    opacity:0.9
  })
);

haloPlane.rotation.x=-Math.PI/2;
scene.add(haloPlane);

// ==========================================
// ANIMACIÓN
// ==========================================

let tw=0;

function animate(){

  requestAnimationFrame(animate);

  const t=performance.now()*0.001;

  tw=(tw+0.0003)%1;
  starTex.offset.set(tw,0);

  galaxy.rotation.y=t*0.05;
  core.rotation.y=t*0.12;
  photonRing.rotation.z=t*0.18;
  haloPlane.rotation.z=t*0.02;

  controls.update();
  renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
  renderer.setSize(innerWidth,innerHeight);
  setCam();
});

}catch(e){
  const err=document.getElementById("err");
  err.textContent="Error al cargar la galaxia: "+e.message;
  err.style.display="block";
}

// ==========================================
// EFECTO DE CORAZONES
// ==========================================

const fx=document.getElementById("fx");
const ctx=fx.getContext("2d");

let DPR=1;

function resizeFx(){
  DPR=Math.min(2,devicePixelRatio||1);
  fx.width=Math.floor(innerWidth*DPR);
  fx.height=Math.floor(innerHeight*DPR);
}

resizeFx();
window.addEventListener("resize",resizeFx);

const hearts=[];

function spawnHearts(x,y,n=20){

  x*=DPR;
  y*=DPR;

  for(let i=0;i<n;i++){

    let a=Math.random()*Math.PI*2;

    hearts.push({
      x:x,
      y:y,
      vx:Math.cos(a)*(0.6+Math.random()*0.8)*DPR,
      vy:-(0.8+Math.random()*1.2)*DPR,
      life:1,
      size:(10+Math.random()*16)*DPR
    });
  }
}

function drawHeart(x,y,size){

  ctx.save();
  ctx.translate(x,y);

  ctx.beginPath();
  ctx.moveTo(0,-0.25*size);

  ctx.bezierCurveTo(
    0.5*size,-0.9*size,
    1.4*size,-0.1*size,
    0,0.9*size
  );

  ctx.bezierCurveTo(
    -1.4*size,-0.1*size,
    -0.5*size,-0.9*size,
    0,-0.25*size
  );

  const g=ctx.createRadialGradient(
    0,0,0,0,0,size
  );

  g.addColorStop(0,"rgba(255,190,220,0.95)");
  g.addColorStop(1,"rgba(255,90,160,0)");

  ctx.fillStyle=g;
  ctx.fill();
  ctx.restore();
}

let lastTap=0;

function detectDoubleTap(x,y){

  const now=performance.now();

  if(now-lastTap<350){
    spawnHearts(x,y,25);
  }

  lastTap=now;
}

window.addEventListener("dblclick",e=>{
  spawnHearts(e.clientX,e.clientY,25);
});

window.addEventListener("touchend",e=>{
  const t=e.changedTouches[0];
  if(t)detectDoubleTap(t.clientX,t.clientY);
},{passive:true});

function animateHearts(){

  ctx.clearRect(0,0,fx.width,fx.height);

  for(let i=hearts.length-1;i>=0;i--){

    const h=hearts[i];

    h.x+=h.vx;
    h.y+=h.vy;
    h.vy-=0.02*DPR;
    h.life-=0.015;

    ctx.globalAlpha=Math.max(0,h.life);
    drawHeart(h.x,h.y,h.size);
    ctx.globalAlpha=1;

    if(h.life<=0){
      hearts.splice(i,1);
    }
  }

  requestAnimationFrame(animateHearts);
}

animateHearts();

})();
</script>
</body>
</html>
